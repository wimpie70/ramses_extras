set_fan_speed_mode:
  name: Set Fan Speed Mode
  description: Set the fan speed mode for a Ramses device (requires ramses_cc integration).
  target:
    entity: {}
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:
    mode:
      name: Mode
      description: The fan speed mode to set.
      required: true
      example: "auto"
      selector:
        select:
          options:
            - "low"
            - "medium"
            - "high"
            - "auto"
            - "away"
            - "boost"
    duration:
      name: Duration
      description: How long to maintain this mode in minutes (optional, max 1440 minutes/24 hours).
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
    reason:
      name: Reason
      description: Reason for the manual override (optional, for logging purposes).
      required: false
      example: "High humidity detected"
      selector:
        text:

update_fan_params:
  name: Update Fan Parameters
  description: Request a full refresh of all 2411 parameters from the device (sequential RQ sequence). Alias of ramses_cc.update_fan_params, kept for backward compatibility.
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:
    from_id:
      name: From ID
      description: Optional source device ID (e.g., a bound remote).
      required: false
      selector:
        text:

set_fan_parameter:
  name: Set Fan Parameter
  description: Set a specific 2411 parameter on a fan device. Alias of ramses_cc.set_fan_param, kept for backward compatibility.
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:
    param_id:
      name: Parameter ID
      description: The 2-digit hex ID of the parameter.
      required: true
      example: "31"
      selector:
        text:
    value:
      name: Value
      description: The value to set for the parameter.
      required: true
      example: "5"
      selector:
        text:
    from_id:
      name: From ID
      description: Optional source device ID (e.g., a bound remote).
      required: false
      selector:
        text:

get_queue_statistics:
  name: Get Queue Statistics
  description: Refresh the RAMSES command queue statistics in the integration data.
  fields: {}

enable_co2_control:
  name: Enable CO2 Control
  description: Enable CO2-based ventilation control for a device.
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:

disable_co2_control:
  name: Disable CO2 Control
  description: Disable CO2-based ventilation control for a device.
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:

set_zone_threshold:
  name: Set Zone CO2 Threshold
  description: Set CO2 threshold for a specific zone.
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:
    zone_id:
      name: Zone ID
      description: The zone identifier.
      required: true
      example: "zone_1"
      selector:
        text:
    threshold:
      name: CO2 Threshold
      description: CO2 threshold in ppm.
      required: true
      example: 1000
      selector:
        number:
          min: 400
          max: 2000
          step: 50
          unit_of_measurement: ppm

trigger_co2_boost:
  name: Trigger CO2 Boost
  description: Manually trigger CO2-based boost mode.
  fields:
    device_id:
      name: Device ID
      description: The Ramses device ID (e.g., "32:153289").
      required: true
      example: "32:153289"
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Duration in minutes.
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: minutes

# Zone testing services (Phase 5 hardware testing)
set_zone_demand:
  name: Set Zone Demand
  description: Manually set zone demand for hardware testing
  fields:
    device_id:
      name: Device ID
      description: FAN device ID (e.g., 32:153289)
      required: true
      example: "32:153289"
      selector:
        text:
    zone_id:
      name: Zone ID
      description: Zone identifier
      required: true
      example: "zone 1 + 2"
      selector:
        text:
    has_demand:
      name: Has Demand
      description: Set to true to trigger demand, false to clear
      required: false
      default: true
      selector:
        boolean:

clear_zone_demand:
  name: Clear Zone Demand
  description: Clear manual zone demand for hardware testing
  fields:
    device_id:
      name: Device ID
      description: FAN device ID (e.g., 32:153289)
      required: true
      example: "32:153289"
      selector:
        text:
    zone_id:
      name: Zone ID
      description: Zone identifier (optional - clears all if not provided)
      required: false
      example: "zone 1 + 2"
      selector:
        text:

set_zone_veto:
  name: Set Zone Veto
  description: >-
    Manually set a zone veto (inhibit) for testing. While a veto is active
    the zone is driven to its minimum position regardless of demands.
  fields:
    device_id:
      name: Device ID
      description: FAN device ID (e.g., 32:153289)
      required: true
      example: "32:153289"
      selector:
        text:
    zone_id:
      name: Zone ID
      description: Zone identifier
      required: true
      example: "zone 1 + 2"
      selector:
        text:
    vetoed:
      name: Vetoed
      description: Set to true to inhibit the zone, false to release
      required: false
      default: true
      selector:
        boolean:

clear_zone_veto:
  name: Clear Zone Veto
  description: Clear manual zone veto for testing
  fields:
    device_id:
      name: Device ID
      description: FAN device ID (e.g., 32:153289)
      required: true
      example: "32:153289"
      selector:
        text:
    zone_id:
      name: Zone ID
      description: Zone identifier (optional - clears all if not provided)
      required: false
      example: "zone 1 + 2"
      selector:
        text:

run_zone_actuation:
  name: Run Zone Actuation
  description: Trigger zone actuation cycle for hardware testing
  fields:
    device_id:
      name: Device ID
      description: FAN device ID (e.g., 32:153289)
      required: true
      example: "32:153289"
      selector:
        text:

# Floorplan Helper services (ha-floorplan managed regeneration)
floorplan_export:
  name: Floorplan Export
  description: >-
    Regenerate the ha-floorplan bundle (elements SVG, rules YAML, change
    report) from the discovered RAMSES topology and the stored mapping.
    Response contains a paste-ready floorplan card configuration.
  fields: {}

floorplan_set_element:
  name: Floorplan Set Element
  description: >-
    Upsert (or remove) an SVG element binding in the stored floorplan
    mapping. Applies on the next floorplan_export.
  fields:
    element_id:
      name: Element ID
      description: SVG element id (default convention is the bound entity_id).
      required: true
      example: "climate.13_045678"
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Entity to bind to the element.
      required: false
      selector:
        entity:
    icon:
      name: Icon
      description: Icon key for this element (see floorplan icon list).
      required: false
      example: "radiator"
      selector:
        text:
    extra_rules:
      name: Extra Rules
      description: >-
        Custom floorplan rule blobs (YAML) emitted verbatim inside the
        managed rules block for this element.
      required: false
      selector:
        object:
    remove:
      name: Remove
      description: Remove this element binding instead of updating it.
      required: false
      default: false
      selector:
        boolean:

floorplan_set_icon:
  name: Floorplan Set Icon
  description: >-
    Set or clear an icon override for a RAMSES device class (e.g. FAN,
    TRV, CTL) or for a specific entity id.
  fields:
    target:
      name: Target
      description: Device class (FAN, TRV, CTL, HGI, DHW...) or entity_id.
      required: true
      example: "TRV"
      selector:
        text:
    icon:
      name: Icon
      description: Icon key; omit/empty to clear the override.
      required: false
      example: "radiator"
      selector:
        text:

floorplan_assign_area:
  name: Floorplan Assign Area
  description: >-
    Bind a RAMSES device or zone to a Home Assistant area for floorplan
    grouping (overrides registry-derived areas).
  fields:
    source:
      name: Source
      description: RAMSES device id (e.g. 04:123456) or entity id.
      required: true
      example: "04:123456"
      selector:
        text:
    area_id:
      name: Area ID
      description: HA area id; omit/empty to clear the binding.
      required: false
      selector:
        area:

floorplan_set_svg:
  name: Floorplan Set SVG
  description: >-
    Switch between the generated elements SVG and a custom user SVG.
    Pass custom_svg_path to use your own drawing; omit to revert to the
    generated plan.
  fields:
    custom_svg_path:
      name: Custom SVG Path
      description: >-
        Web path to your SVG (e.g. /local/ramses_extras/floorplan/my-plan.svg).
        Pass empty to use the generated elements SVG; omit to leave the
        SVG mode unchanged.
      required: false
      example: "/local/ramses_extras/floorplan/my-plan.svg"
      selector:
        text:
    editor_url:
      name: Editor URL
      description: >-
        Target of the in-SVG editor button. Internal paths (leading /)
        navigate in place; anything else opens in a new tab.
      required: false
      example: "/floorplan-studio/0"
      selector:
        text:
    planner_url:
      name: Planner URL
      description: >-
        Target of the in-SVG planner/drawing button. Same navigation
        rules as editor_url.
      required: false
      example: "/floorplan-studio/0"
      selector:
        text:
    toolbar_enabled:
      name: Toolbar Enabled
      description: Emit the in-SVG toolbar rules in the managed block.
      required: false
      selector:
        boolean:

floorplan_import:
  name: Floorplan Import
  description: >-
    Import floorplan YAML (e.g. the card config emitted by the external
    ha-floorplan-editor tool) into the stored mapping. Rules carrying an
    element plus an entity become element bindings; all other rules are
    kept verbatim in extra rules and re-emitted inside the managed block
    on the next floorplan_export.
  fields:
    yaml_text:
      name: YAML
      description: >-
        Pasted floorplan YAML — a floorplan card config, a dashboard
        view fragment, or a bare rules list.
      required: true
      example: |
        rules:
          - element: area.kitchen
            entity: light.kitchen
            tap_action:
              action: toggle
      selector:
        text:
          multiline: true
    replace:
      name: Replace Extra Rules
      description: >-
        Replace all stored extra rules with the imported ones instead of
        merging. Element bindings are always merged.
      required: false
      default: false
      selector:
        boolean:

floorplan_upload_svg:
  name: Floorplan Upload SVG
  description: >-
    Write an SVG file into config/www/ramses_extras/floorplan/ and
    optionally activate it as the custom floorplan SVG — the file bridge
    for externally drawn plans (Inkscape, HA-floorplanner-gui).
  fields:
    filename:
      name: Filename
      description: Target filename inside the floorplan dir (.svg appended if missing).
      required: true
      example: "my-plan.svg"
      selector:
        text:
    svg_text:
      name: SVG Content
      description: The SVG document text.
      required: true
      selector:
        text:
          multiline: true
    set_as_active:
      name: Set As Active
      description: Switch svg_mode to custom and point the bundle at this file.
      required: false
      default: true
      selector:
        boolean:

floorplan_sync_areas:
  name: Floorplan Sync Areas
  description: >-
    Import a floorplan-studio project export (Projects → Export JSON) and
    sync it into HA's registries: creates HA areas for room names
    (optional) and assigns each marker's entities to the smallest room
    containing it. Marker placement in the studio then drives real
    entity-registry area ids, which the floorplan topology reads on the
    next floorplan_export.
  fields:
    project_json:
      name: Project JSON
      description: >-
        The floorplan-studio project file contents (Projects → Export
        current as JSON).
      required: true
      selector:
        text:
          multiline: true
    create_areas:
      name: Create Areas
      description: Create HA areas for studio rooms that don't match an existing area.
      required: false
      default: true
      selector:
        boolean:
    dry_run:
      name: Dry Run
      description: Report what would be created/assigned without changing the registries.
      required: false
      default: false
      selector:
        boolean:
