homeassistant:
  name: Home Simulator
  latitude: 52.0
  longitude: 5.0
  elevation: 0
  unit_system: metric
  time_zone: Europe/Amsterdam
  country: NL
  language: en
  packages: !include_dir_named packages

# Enable standard integrations (excluding bluetooth to avoid container permission warnings)
api:
automation:
config:
counter:
dhcp:
energy:
frontend:
history:
homeassistant_hardware:
input_boolean:
input_button:
input_datetime:
input_number:
input_select:
input_text:
logbook:
media_source:
my:
person:
scene:
script:
select:
sun:
system_health:
tag:
timer:
webhook:
zone:

logger:
  default: info
  logs:
    custom_components.ramses_cc: debug
    ramses_rf: debug
    ramses_tx: debug
    custom_components.ramses_extras: debug

system_log:
  max_entries: 1000
